name: iOS tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: iOS tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: SeenAt
        run: xcodegen generate

      - name: Run unit tests
        working-directory: SeenAt
        run: >-
          xcodebuild test
          -project SeenAt.xcodeproj
          -scheme SeenAt
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
